schema: spec-driven

context: |
  Public OSS Java library info.unterrainer.commons:rest-client, published to Maven Central
  on every push to master (tests are skipped in CI). A REST client on OkHttp 3 with
  Keycloak bearer-token support (KeycloakContext, Get/Post/Put/DelKeycloakBuilder).
  Java 21, Maven, Lombok, JUnit 5. Consumers: java-cms-data-logger, java-overmind-server,
  java-elite-server.
  All repo content (code, comments, Javadoc, logs, docs, commits, OpenSpec artifacts) is English.

rules:
  proposal:
    - State in the Impact section which consumers are affected and whether callers must change.
    - Mark anything that changes existing caller-visible behaviour as BREAKING.
  tasks:
    - Include test tasks for every behaviour change; tests run offline against a local HttpServer.
    - End with setting the pom version to the one the push will mint.

